<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05070f">
<title>Nexus Gaming | الفعاليات</title>
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#05070f;--s:#0b1226;--s2:#141d38;--b:#2f7bff;--c:#3fd0ff;--t:#e8f1ff;--m:#8493b5;--r:#ff3b4e;--g:#ffcf5a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.6 Tajawal,system-ui,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);min-height:100vh}
h1,h2,h3{font-family:Lalezar,Tajawal,sans-serif;font-weight:400;margin:0}
button{font:inherit;color:inherit;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--c);outline-offset:2px}
#intro{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center;transition:opacity .8s;overflow:hidden}
#intro.out{opacity:0;pointer-events:none}
#intro img{width:100%;max-height:100%;object-fit:contain;animation:zin 3.8s cubic-bezier(.2,.7,.2,1) forwards}
#intro::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 40%,rgba(120,200,255,.35) 50%,transparent 60%);transform:translateX(120%);animation:sweep 1.6s 1.1s ease-out forwards}
.bar{position:absolute;bottom:calc(28px + env(safe-area-inset-bottom,0px));left:20%;right:20%;height:3px;background:#12203f;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b),var(--c));animation:fill 3.6s linear forwards}
@keyframes zin{0%{transform:scale(1.35);opacity:0;filter:blur(14px) brightness(2.5)}35%{opacity:1;filter:blur(0) brightness(1.3)}100%{transform:scale(1);opacity:1;filter:none}}
@keyframes sweep{to{transform:translateX(-120%)}}
@keyframes fill{to{width:100%}}
.boot{padding:40vh 20px;text-align:center;color:var(--m)}
#fire{position:fixed;inset:0;z-index:0}
.login{position:relative;z-index:1;min-height:100vh;display:grid;place-items:center;padding:20px}
.lc{width:100%;max-width:380px;text-align:center;padding:34px 24px;border-radius:24px;background:rgba(8,14,32,.55);backdrop-filter:blur(10px);border:1px solid rgba(63,208,255,.35);box-shadow:0 0 60px rgba(47,123,255,.35),inset 0 0 30px rgba(47,123,255,.12);animation:rise .9s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(30px)}}
.lc h1{font-size:40px;line-height:1.2;text-shadow:0 0 24px var(--b)}
.lc p{color:var(--m);margin:10px 0 26px}
.go{width:100%;padding:15px;border-radius:14px;font-weight:700;font-size:18px;background:linear-gradient(135deg,#5865f2,var(--b));box-shadow:0 0 28px rgba(88,101,242,.6);transition:transform .15s}
.go:active{transform:scale(.97)}
.err{background:rgba(255,59,78,.15);border:1px solid var(--r);border-radius:12px;padding:10px;margin-bottom:16px;font-size:14px}
.wrap{max-width:680px;margin:0 auto;padding:0 14px 40px}
.hero{position:relative;margin:0 -14px;padding:18px 18px 22px;background:linear-gradient(#05070fcc,#05070f 98%),url(logo.jpg) center/cover;border-bottom:1px solid #16264a}
.hero .u{display:flex;align-items:center;gap:10px}
.hero .u img{width:44px;height:44px;border-radius:50%;border:2px solid var(--c);box-shadow:0 0 16px var(--b)}
.hero .u b{flex:1;font-size:17px}
.hero .u button{background:#ffffff14;padding:7px 14px;border-radius:10px;font-size:14px}
.hero h2{font-size:34px;margin:18px 0 12px;text-shadow:0 0 22px var(--b)}
.chips{display:flex;gap:8px}
.chips span{flex:1;background:#0b1226cc;border:1px solid #1b2c55;border-radius:12px;padding:8px;text-align:center;font-size:13px;color:var(--m)}
.chips b{display:block;font:22px Lalezar;color:var(--c)}
nav{display:flex;gap:6px;margin:16px 0;position:sticky;top:0;background:var(--bg);padding:8px 0;z-index:5}
nav button{flex:1;background:var(--s);color:var(--m);padding:11px;border-radius:12px;font-weight:700}
nav button.on{background:linear-gradient(135deg,var(--b),#1b4fd0);color:#fff;box-shadow:0 0 20px #2f7bff66}
.msg{background:var(--s2);border-right:3px solid var(--c);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.card{--k:var(--b);position:relative;background:linear-gradient(160deg,var(--s2),var(--s));border-radius:18px;padding:18px 18px 18px 16px;margin-bottom:14px;border:1px solid #1b2c55;border-right:5px solid var(--k);box-shadow:0 8px 30px #0008,0 0 40px color-mix(in srgb,var(--k) 18%,transparent)}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--m)}
.tag{background:color-mix(in srgb,var(--k) 25%,transparent);color:var(--k);padding:3px 12px;border-radius:20px;font-weight:700;border:1px solid var(--k)}
.card h3{font-size:25px;margin:10px 0 2px}
.card p{margin:0;color:var(--m);font-size:15px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:16px}
.cd{font-weight:700;color:var(--c);font-variant-numeric:tabular-nums}
.cd.x{color:var(--r)}
.btn{padding:10px 22px;border-radius:12px;font-weight:700;background:linear-gradient(135deg,var(--b),var(--c));color:#04101f}
.btn.g{background:#ffffff14;color:var(--t)}
.btn:disabled{opacity:.4}
.win{margin-top:14px;border-top:1px dashed #2a3c6b;padding-top:10px}
.w{display:flex;align-items:center;gap:10px;padding:6px 0}
.w b{font:20px Lalezar;color:var(--g);min-width:26px}
.w img{width:30px;height:30px;border-radius:50%}
.w.me{color:var(--g)}
.done{color:var(--g);font-weight:700}
label{display:block;font-size:14px;color:var(--m);margin-top:10px}
input,textarea,select{width:100%;background:#0a1124;border:1px solid #223664;border-radius:10px;padding:10px;color:var(--t);font:inherit;margin-top:4px}
.opt{display:block;width:100%;margin-top:8px;text-align:right}.bar2{height:6px;background:#12203f;border-radius:6px;margin:4px 0 8px;overflow:hidden}.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--b),var(--c))}
.sec{position:static}.sec button{font:20px Lalezar;padding:14px}.sec button.on{background:linear-gradient(135deg,var(--b),#1b4fd0);color:#fff}
.vc{position:relative;aspect-ratio:1.586;border-radius:20px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:0 14px 40px #000a;overflow:hidden;background:linear-gradient(135deg,var(--k),#050a1a);margin-bottom:14px}
.vc::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,#ffffff22 50%,transparent 60%);pointer-events:none}
.vc .t,.vc .b{display:flex;align-items:center;gap:10px;justify-content:space-between}.vc .no{font:26px/1 monospace;letter-spacing:3px;direction:ltr;text-align:center}
.vc .b img{width:38px;height:38px;border-radius:50%;border:2px solid #fff8}
.lg{display:inline-flex;align-items:center;height:34px;max-width:130px;background:#fff;border-radius:8px;padding:3px 8px;color:#111;font-size:13px}.lg img{display:none;height:100%;max-width:100%;object-fit:contain}.lg.ok img{display:block}.lg.ok b{display:none}
.bk{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.bk button{background:var(--s2);border:2px solid transparent;border-radius:14px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700}.bk button.on{border-color:var(--c)}
.empty{text-align:center;color:var(--m);padding:40px 10px}
#reveal{position:fixed;inset:0;z-index:40;background:radial-gradient(circle,#1a2f66ee,#02040aee);display:grid;place-content:center;text-align:center;padding:20px}
#reveal h2{font-size:46px;color:var(--g);text-shadow:0 0 40px var(--g);animation:rise .8s both}
#reveal .n{font:34px Lalezar;margin:14px 0;animation:rise .8s both}
#reveal small{color:var(--m);margin-top:30px;display:block}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important}}
</style>
</head>
<body>
<div id="intro"><img src="logo.jpg" alt="Nexus Gaming"><div class="bar"><i></i></div></div>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
const FIRE=[195,32]; /* درجة لون النار: للون برتقالي غيّرها إلى [12,40] */
const TYPES={draw:['سحب','#3fd0ff'],contest:['مسابقة','#2f7bff'],vote:['تصويت','#b06bff'],tournament:['بطولة','#ff3b4e']};
const app=document.getElementById('app');
let bal=null,ords=[],sec='events',bt='me',acct=null,items=[],purch=[],pbk='',sb,me,isAdmin=false,tab='events',events=[],wins={},votes=[],counts={},board=[],logs=[],myRegs=new Set(),notice='';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=d=>new Date(d).toLocaleString('ar',{dateStyle:'medium',timeStyle:'short'});
const pad=n=>String(n).padStart(2,'0');

function playIntro(){return new Promise(r=>{const el=document.getElementById('intro');let seen;
 try{seen=sessionStorage.getItem('nx')}catch(e){}
 if(seen){el.remove();return r()}
 try{sessionStorage.setItem('nx','1')}catch(e){}
 let done=0;const end=()=>{if(done++)return;el.classList.add('out');setTimeout(()=>{el.remove();r()},800)};
 setTimeout(end,3900);el.onclick=end})}

function fire(cv){const x=cv.getContext('2d');let W,H,P=[];
 const rs=()=>{W=cv.width=innerWidth;H=cv.height=innerHeight};rs();addEventListener('resize',rs);
 if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
 (function f(){if(!cv.isConnected)return;
  x.globalCompositeOperation='source-over';x.fillStyle='rgba(5,7,15,.2)';x.fillRect(0,0,W,H);
  x.globalCompositeOperation='lighter';
  for(let i=0;i<7;i++)P.push({x:W*(.3+Math.random()*.4),y:H*.66,vx:(Math.random()-.5)*.7,vy:-(1.3+Math.random()*2.8),r:9+Math.random()*16,l:1});
  P=P.filter(p=>p.l>0);
  for(const p of P){p.x+=p.vx+Math.sin(p.y/28)*.5;p.y+=p.vy;p.l-=.011;p.r*=.986;
   x.fillStyle=`hsla(${FIRE[0]+p.l*FIRE[1]},100%,${42+p.l*28}%,${p.l*.4})`;x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}
  requestAnimationFrame(f)})()}

function renderLogin(msg){
 app.innerHTML=`<canvas id="fire"></canvas><div class="login"><div class="lc"><h1>Nexus Gaming</h1><p>مسابقات وفعاليات وبطولات مجتمعنا. الدخول لأعضاء السيرفر فقط.</p>${msg?`<div class="err">${esc(msg)}</div>`:''}<button class="go" onclick="login()">المتابعة بحساب ديسكورد</button></div></div>`;
 fire(document.getElementById('fire'))}
async function login(){await sb.auth.signInWithOAuth({provider:'discord',options:{scopes:'identify guilds.members.read',redirectTo:location.origin+location.pathname}})}
async function logout(){await sb.auth.signOut();location.reload()}

async function init(){
 const ip=playIntro();
 if(!window.NEXUS||!NEXUS.key||NEXUS.key.includes('PASTE')){await ip;app.innerHTML='<div class="boot">ملف config.js ناقص أو المفتاح غير مضاف.</div>';return}
 sb=supabase.createClient(NEXUS.url,NEXUS.key);
 const {data:{session}}=await sb.auth.getSession();
 await ip;
 if(!session)return renderLogin();
 app.innerHTML='<div class="boot">جاري التحقق…</div>';
 const meta=session.user.user_metadata||{},id=meta.provider_id;
 if(session.provider_token){
  try{const {data,error}=await sb.functions.invoke('verify-member',{body:{token:session.provider_token}});
   if(error||!data?.ok){await sb.auth.signOut();return renderLogin('لازم تكون عضو بالسيرفر عشان تدخل.')}
  }catch(e){await sb.auth.signOut();return renderLogin('تعذّر التحقق من العضوية، جرّب مرة ثانية.')}}
 const {data:m}=await sb.from('members').select('discord_id,username,avatar_url,is_admin,verified').eq('discord_id',id).maybeSingle();
 if(!m||!m.verified){await sb.auth.signOut();return renderLogin('سجّل الدخول من جديد لإكمال التحقق.')}
 me=m;isAdmin=!!m.is_admin;await load();render();setInterval(tick,1000);setInterval(async()=>{if(sec==='bank'&&acct&&bt!=='adm'){await load();render()}},30000)}

async function load(){
 const {data:ev}=await sb.from('events').select('*').eq('is_archived',false).order('starts_at');events=ev||[];
 const {data:w}=await sb.from('winners').select('event_id,place,member_id,members(username,avatar_url)');
 wins={};(w||[]).forEach(x=>(wins[x.event_id]=wins[x.event_id]||[]).push(x));
 const {data:vt}=await sb.from('votes').select('event_id,choice,voter_id');votes=vt||[];
 const {data:ct}=await sb.rpc('event_counts');counts={};(ct||[]).forEach(c=>counts[c.event_id]=c);
 const {data:bd}=await sb.from('members').select('username,avatar_url,points').order('points',{ascending:false}).limit(10);board=bd||[];
 const {data:mm}=await sb.from('members').select('points').eq('discord_id',me.discord_id).maybeSingle();if(mm)me.points=mm.points;
 if(isAdmin){const {data:lg}=await sb.from('audit_log').select('action,created_at,members(username)').order('created_at',{ascending:false}).limit(15);logs=lg||[]}
 const {data:ac}=await sb.from('bank_accounts').select('*').eq('member_id',me.discord_id).maybeSingle();acct=ac;
 const {data:it}=await sb.from('store_items').select('*').eq('active',true).order('price');items=it||[];
 const {data:bb}=await sb.from('bot_balances').select('*').eq('discord_id',me.discord_id).maybeSingle();bal=bb;
 const {data:od}=await sb.from('web_orders').select('kind,item,amount,status,result,created_at,member_id,members(username)').order('created_at',{ascending:false}).limit(20);ords=od||[];
 const {data:rg}=await sb.from('registrations').select('event_id,status').eq('member_id',me.discord_id).neq('status','cancelled');
 myRegs=new Map((rg||[]).map(r=>[r.event_id,r.status]))}

function render(){
 const act=events.filter(e=>!e.ended_at).length,end=events.length-act;
 const tabs=[['events','النشطة'],['winners','الفائزون'],['rank','الترتيب']];if(isAdmin)tabs.push(['admin','الإدارة']);
 app.innerHTML=`<div class="wrap"><div class="hero"><div class="u">${me.avatar_url?`<img src="${esc(me.avatar_url)}" alt="">`:''}<b>${esc(me.username)}</b><button onclick="logout()">خروج</button></div>
 <h2>ساحة المنافسة</h2><div class="chips"><span><b>${act}</b>فعالية نشطة</span><span><b>${myRegs.size}</b>تسجيلاتي</span><span><b>${end}</b>منتهية</span></div></div>
 <nav class="sec"><button class="${sec==='events'?'on':''}" onclick="sec='events';notice='';render()">الفعاليات</button><button class="${sec==='bank'?'on':''}" onclick="sec='bank';notice='';render()">🏦 البنك</button></nav>${sec==='events'?`<nav>${tabs.map(([k,v])=>`<button class="${tab===k?'on':''}" onclick="go('${k}')">${v}</button>`).join('')}</nav>`:''}
 ${notice?`<div class="msg">${esc(notice)}</div>`:''}<div id="view"></div></div>`;
 const v=document.getElementById('view');
 v.innerHTML=sec==='bank'?bankView():tab==='admin'?adminView():tab==='rank'?rankView():listView(tab==='events'?events.filter(e=>!e.ended_at):events.filter(e=>e.ended_at))}
function go(t){tab=t;notice='';render()}

function left(e){const ms=new Date(e.registration_closes_at)-Date.now();if(ms<=0)return null;
 const s=Math.floor(ms/1000),d=Math.floor(s/86400);
 return(d?d+' يوم ':'')+[Math.floor(s%86400/3600),Math.floor(s%3600/60),s%60].map(pad).join(':')}

function winHTML(e){const ws=(wins[e.id]||[]).sort((a,b)=>a.place-b.place);
 if(!ws.length)return'<div class="win muted">انتهت الفعالية.</div>';
 const won=ws.some(w=>w.member_id===me.discord_id);
 return`<div class="win">${won?'<div class="done">🏆 مبروك! إنت من الفائزين</div>':'<div class="done">انتهت الفعالية، الفائزون:</div>'}${ws.map(w=>`<div class="w ${w.member_id===me.discord_id?'me':''}"><b>${w.place}</b>${w.members?.avatar_url?`<img src="${esc(w.members.avatar_url)}" alt="">`:''}<span>${esc(w.members?.username)}</span></div>`).join('')}</div>`}

function listView(list){
 if(!list.length)return`<div class="empty">${tab==='events'?'ما في فعاليات نشطة حالياً. ارجع قريباً.':'لسا ما انتهت أي فعالية.'}</div>`;
 return list.map(e=>{const [tn,col]=TYPES[e.type]||TYPES.draw,open=left(e)!==null,reg=myRegs.has(e.id);
  return`<div class="card" style="--k:${col}"><div class="top"><span class="tag">${tn}</span><span>${fmt(e.starts_at)}</span></div><h3>${esc(e.title)}</h3><p>${esc(e.description||'')}</p>${e.type==='vote'?'':`<div class="muted" style="margin-top:6px">👥 ${cntTxt(e)}</div>`}
  ${e.type==='vote'?voteHTML(e,open):e.ended_at?winHTML(e):`<div class="row"><span data-close="${e.id}" class="cd ${open?'':'x'}">${open?'يقفل التسجيل بعد '+left(e):'التسجيل مقفل'}</span>${reg?`<button class="btn g" ${open?'':'disabled'} onclick="unreg('${e.id}')">${myRegs.get(e.id)==='waitlist'?'إلغاء (قائمة الانتظار)':'إلغاء التسجيل'}</button>`:`<button class="btn" ${open?'':'disabled'} onclick="reg('${e.id}')">${full(e)?'انضم لقائمة الانتظار':'سجّل الآن'}</button>`}</div>`}</div>`}).join('')}

function voteHTML(e,open){const o=e.options||[],vs=votes.filter(v=>v.event_id===e.id),mine=vs.find(v=>v.voter_id===me.discord_id);
 if(e.ended_at){const c=o.map((_,i)=>vs.filter(v=>v.choice===i).length),mx=Math.max(...c,1),tot=vs.length||1;
  return`<div class="win"><div class="done">انتهى التصويت، النتيجة:</div>${o.map((t,i)=>`<div class="w ${c[i]===mx&&c[i]>0?'me':''}" style="display:block"><div class="row" style="margin:0"><span>${esc(t)}</span><b>${c[i]} (${Math.round(c[i]/tot*100)}%)</b></div><div class="bar2"><i style="width:${c[i]/tot*100}%"></i></div></div>`).join('')}</div>`}
 if(mine)return`<div class="win"><div class="done">تم تسجيل صوتك: ${esc(o[mine.choice])}</div></div>`;
 if(!open)return'<div class="win"><span class="cd x">التصويت مقفل</span></div>';
 return`<div class="win"><span class="cd" data-v="1" data-close="${e.id}">يقفل التصويت بعد ${left(e)}</span>${o.map((t,i)=>`<button class="btn g opt" onclick="castVote('${e.id}',${i})">${esc(t)}</button>`).join('')}</div>`}
async function castVote(id,i){const {error}=await sb.from('votes').insert({event_id:id,voter_id:me.discord_id,choice:i});
 notice=error?'ما انحسب صوتك: غالباً التصويت انقفل أو صوّتت قبل.':'تم تسجيل صوتك.';await load();render()}
const CUR='🪙';const wal=()=>bal?.coins||0,bnk=()=>bal?.bank||0;
const BANKS={pal:['بنك فلسطين','bank-pal.png','#0d7a45'],ahli:['البنك الأهلي','bank-ahli.png','#1b4fd0'],arab:['البنك العربي','bank-arab.png','#7a1f2b'],quds:['بنك القدس','bank-quds.png','#0f5a8a']};
const EXT=['png','jpg','jpeg','webp','svg'];
const logo=k=>`<span class="lg"><img src="bank-${k}.png" data-k="${k}" data-i="0" alt="" onload="this.parentNode.classList.add('ok')" onerror="nextLogo(this)"><b>${BANKS[k][0]}</b></span>`;
function nextLogo(i){const n=+i.dataset.i+1;if(n<EXT.length){i.dataset.i=n;i.src='bank-'+i.dataset.k+'.'+EXT[n]}else i.remove()}
const money=n=>Number(n).toLocaleString('en')+' '+CUR;
function bankView(){
 const sub=`<nav>${[['me','حسابي'],['shop','المتجر']].concat(isAdmin?[['adm','إدارة البنك']]:[]).map(([k,v])=>`<button class="${bt===k?'on':''}" onclick="bt='${k}';render()">${v}</button>`).join('')}</nav>`;
 if(bt==='adm'&&isAdmin)return sub+bankAdmin();
 if(!acct)return sub+openForm();
 return sub+(bt==='shop'?shopView():cardView())}
function openForm(){return`<div class="card"><h3>فتح حساب بنكي</h3><label>الاسم</label><input id="b_n"><label>تاريخ الميلاد</label><input id="b_d" type="date"><label>الدولة</label><input id="b_c"><label>اختر البنك</label>
 <div class="bk">${Object.entries(BANKS).map(([k,v])=>`<button class="${pbk===k?'on':''}" onclick="pickBank('${k}',this)">${logo(k)}<span>${v[0]}</span></button>`).join('')}</div><div class="row"><button class="btn" onclick="openAcct()">فتح الحساب</button></div></div>`}
function pickBank(k,el){pbk=k;document.querySelectorAll('.bk button').forEach(b=>b.classList.remove('on'));el.classList.add('on')}
async function openAcct(){const n=b_n.value.trim(),d=b_d.value,c=b_c.value.trim();if(!n||!d||!c||!pbk){notice='عبّي كل الخانات واختر بنك.';return render()}
 const {error}=await sb.rpc('open_account',{n,b:d,c,bk:pbk});notice=error?'تعذّر فتح الحساب: '+error.message:'انفتح حسابك، هاي بطاقتك.';await load();render()}
function cardView(){const bk=BANKS[acct.bank],no=acct.card_no.replace(/(\d{3})(?=\d)/g,'$1 ');
 return`<div class="vc" style="--k:${bk[2]}"><div class="t">${logo(acct.bank)}<b style="font:italic 700 26px Tajawal">VISA</b></div><div class="no">${no}</div><div class="b">${me.avatar_url?`<img src="${esc(me.avatar_url)}" alt="">`:''}<div style="flex:1"><b>${esc(acct.full_name)}</b><div style="font-size:13px;opacity:.8">${bk[0]}</div></div><div><small>المحفظة</small><div style="font:24px Lalezar">${money(wal())}</div><small>البنك: ${money(bnk())}</small>${bal?'':'<small> (بانتظار البوت)</small>'}</div></div></div>
 <div class="card"><h3>مشترياتي</h3>${ords.filter(o=>o.member_id===me.discord_id&&o.kind==='buy').slice(0,6).map(o=>`<div class="row" style="margin:6px 0"><span>${esc(o.item)}</span><span class="muted">${o.status==='done'?'✓ تم':o.status==='pending'?'قيد التنفيذ…':esc(o.result||'فشل')}</span></div>`).join('')||'<p>ما في مشتريات.</p>'}</div>`}
function shopView(){if(!acct)return openForm();
 const lo=ords.find(o=>o.member_id===me.discord_id&&o.kind==='buy');return`<div class="msg">محفظتك: ${money(wal())}${lo?` · آخر طلب: ${lo.status==='pending'?'قيد التنفيذ…':esc(lo.result||'')}`:''}</div>`+(items.map(i=>`<div class="card"><h3>${esc(i.name)}</h3><p>${esc(i.description||'')}</p><div class="row"><b class="cd">${money(i.price)}</b><button class="btn" ${i.stock===0||wal()<i.price?'disabled':''} onclick="buy('${i.id}')">${i.stock===0?'نفذت الكمية':'اشتر'}</button></div></div>`).join('')||'<div class="empty">المتجر فاضي حالياً.</div>')}
async function buy(id){if(!confirm('تأكيد الشراء؟'))return;const {error}=await sb.rpc('buy_item',{iid:id});notice=error?'تعذّر الشراء: '+error.message:'تم إرسال طلبك للسيرفر، بيتنفذ خلال ثواني.';await load();render();if(!error)setTimeout(async()=>{await load();render()},20000)}
function bankAdmin(){return`<div class="card"><h3>شحن أو خصم رصيد</h3><label>Discord ID للعضو</label><input id="c_m"><label>المبلغ (سالب للخصم)</label><input id="c_a" type="number"><div class="row"><button class="btn" onclick="credit()">تنفيذ</button></div></div>
 <div class="card"><h3>المتجر</h3><p>المنتجات بتتزامن تلقائياً من قائمة SHOP بالبوت.</p></div>
 <div class="card"><h3>آخر الطلبات</h3>${ords.map(p=>`<div class="muted">${fmt(p.created_at)} · ${esc(p.members?.username)} · ${p.kind} ${esc(p.item||p.amount||'')} · ${p.status}</div>`).join('')||'<p>فاضي.</p>'}</div>`}
async function addItem(){const n=i_n.value.trim(),p=+i_p.value;if(!n||!(p>0)){notice='عبّي الاسم والسعر.';return render()}
 const {error}=await sb.from('store_items').insert({name:n,description:i_d.value,price:p,stock:i_s.value===''?null:+i_s.value});notice=error?'تعذّرت الإضافة: '+error.message:'انضاف المنتج.';await load();render()}
async function delItem(id){if(!confirm('حذف المنتج؟'))return;await sb.from('store_items').update({active:false}).eq('id',id);await load();render()}
async function credit(){const m=c_m.value.trim(),a=+c_a.value;if(!m||!a){notice='عبّي ID العضو والمبلغ.';return render()}
 const {error}=await sb.rpc('admin_credit',{mid:m,amt:a});if(!error)log('رصيد '+a+' للعضو '+m);notice=error?'تعذّر: '+error.message:'تم تنفيذ العملية.';await load();render()}
function tick(){if(tab!=='events')return;
 events.forEach(e=>{const el=document.querySelector(`[data-close="${e.id}"]`);if(!el||e.ended_at)return;const l=left(e);
  if(l===null&&!el.classList.contains('x'))return render();if(l!==null)el.textContent=(el.dataset.v?'يقفل التصويت بعد ':'يقفل التسجيل بعد ')+l})}

const cntTxt=e=>{const c=counts[e.id]||{confirmed:0,waitlist:0};return c.confirmed+(e.max_participants?' / '+e.max_participants:'')+' مسجل'+(c.waitlist?` (+${c.waitlist} انتظار)`:'')};
const full=e=>e.max_participants&&(counts[e.id]?.confirmed||0)>=e.max_participants;
async function log(a,t){await sb.from('audit_log').insert({admin_id:me.discord_id,action:a,target_type:'event',target_id:t||null})}
async function reg(id){const {data,error}=await sb.rpc('register_event',{eid:id});
 notice=error?'ما انسجّل: غالباً التسجيل انقفل أو إنك مسجّل أصلاً.':data==='waitlist'?'الفعالية ممتلئة، انضفت لقائمة الانتظار.':'تم تسجيلك بنجاح.';await load();render()}
function rankView(){const w=Object.values(wins).flat().filter(x=>x.member_id===me.discord_id).length;
 return`<div class="card" style="--k:#ffcf5a"><h3>ملفي</h3><div class="chips" style="margin-top:10px"><span><b>${me.points||0}</b>نقطة</span><span><b>${w}</b>فوز</span><span><b>${myRegs.size}</b>تسجيل نشط</span></div></div><div class="card"><h3>المتصدرون</h3>${board.map((m,i)=>`<div class="w ${m.username===me.username?'me':''}"><b>${i+1}</b>${m.avatar_url?`<img src="${esc(m.avatar_url)}" alt="">`:''}<span style="flex:1">${esc(m.username)}</span><b>${m.points}</b></div>`).join('')||'<p>لسا ما في نقاط.</p>'}</div>`}
async function unreg(id){const {error}=await sb.from('registrations').delete().eq('event_id',id).eq('member_id',me.discord_id);
 notice=error?'تعذّر إلغاء التسجيل.':'تم إلغاء تسجيلك.';await load();render()}

function adminView(){const act=events.filter(e=>!e.ended_at);
 return`<div class="card"><h3>فعالية جديدة</h3>
 <label>النوع</label><select id="a_y" onchange="opts.style.display=this.value==='vote'?'block':'none'">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select>
 <label>الاسم</label><input id="a_t"><label>الوصف</label><textarea id="a_d" rows="2"></textarea><div id="opts" style="display:none">${[1,2,3,4].map(n=>`<label>الخيار ${n}${n>2?' (اختياري)':''}</label><input class="a_o">`).join('')}</div>
 <label>موعد الفعالية</label><input id="a_s" type="datetime-local"><label>إغلاق التسجيل</label><input id="a_c" type="datetime-local"><label>أقصى عدد مشاركين (فاضي = بلا حد)</label><input id="a_m" type="number" min="1">
 <div class="row"><button class="btn" onclick="addEvent()">إضافة الفعالية</button></div></div>
 <div class="card"><h3>إدارة الفعاليات</h3><p>السحب أو إنهاء التصويت بيقفل الفعالية.</p>
 ${events.map(e=>`<div class="row"><span>${esc(e.title)}${e.ended_at?' (منتهية)':''}</span><span>${!e.ended_at?`<button class="btn" onclick="${e.type==='vote'?'endVote':'draw'}('${e.id}')">${e.type==='vote'?'أنهِ التصويت':'اسحب وأنهِ'}</button> `:''}<button class="btn g" onclick="delEvent('${e.id}')">حذف</button></span></div>`).join('')||'<p>ما في فعاليات.</p>'}</div>
 <div class="card"><h3>سجل النشاط</h3>${logs.map(l=>`<div class="muted">${fmt(l.created_at)} · ${esc(l.members?.username)} · ${esc(l.action)}</div>`).join('')||'<p>فاضي.</p>'}</div>
 <div class="card"><h3>منطقة الخطر</h3><p>بيمسح كل الفعاليات والتسجيلات والأصوات والفائزين.</p><div class="row"><button class="btn g" style="color:var(--r)" onclick="wipeAll()">مسح كل السجلات</button></div></div>`}

async function addEvent(){const t=a_t.value.trim(),s=a_s.value,c=a_c.value,ops=[...document.querySelectorAll('.a_o')].map(x=>x.value.trim()).filter(Boolean);
 if(!t||!s||!c||(a_y.value==='vote'&&ops.length<2)){notice='عبّي كل الخانات (وخياران على الأقل للتصويت).';return render()}
 const {error}=await sb.from('events').insert({title:t,type:a_y.value,description:a_d.value,starts_at:new Date(s).toISOString(),registration_closes_at:new Date(c).toISOString(),created_by:me.discord_id,options:a_y.value==='vote'?ops:null,max_participants:a_m.value?+a_m.value:null});
 if(!error)log('إضافة فعالية: '+t);notice=error?'تعذّرت الإضافة: '+error.message:'انضافت الفعالية.';await load();tab=error?'admin':'events';render()}

async function endVote(id){if(!confirm('إنهاء التصويت؟'))return;const e=events.find(x=>x.id===id),now=Date.now();
 const {error}=await sb.from('events').update({ended_at:new Date(now).toISOString(),registration_closes_at:new Date(Math.min(now,+new Date(e.registration_closes_at))).toISOString()}).eq('id',id);
 if(!error)log('إنهاء تصويت',id);notice=error?'تعذّر الإنهاء.':'انتهى التصويت، النتيجة بتبويب الفائزون.';await load();tab=error?'admin':'winners';render()}
async function delEvent(id){if(!confirm('حذف الفعالية وكل تسجيلاتها؟'))return;
 const {error}=await sb.from('events').delete().eq('id',id);if(!error)log('حذف فعالية',id);notice=error?'تعذّر الحذف: '+error.message:'انحذفت الفعالية.';await load();render()}
async function wipeAll(){if(prompt('للتأكيد اكتب كلمة: مسح')!=='مسح')return;
 const {error}=await sb.from('events').delete().neq('id','00000000-0000-0000-0000-000000000000');if(!error)log('مسح كل السجلات');notice=error?'تعذّر المسح: '+error.message:'انمسحت كل السجلات.';await load();render()}
async function draw(id){const n=parseInt(prompt('كم عدد الفائزين؟','1'),10);if(!n)return;
 const e=events.find(x=>x.id===id);
 const {data}=await sb.from('registrations').select('member_id').eq('event_id',id).eq('status','confirmed');
 if(!data||!data.length){notice='ما في مسجلين بهالفعالية.';return render()}
 const pool=data.map(r=>r.member_id);
 for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[pool[i],pool[j]]=[pool[j],pool[i]]}
 const ids=pool.slice(0,n);
 const {error}=await sb.from('winners').insert(ids.map((m,i)=>({event_id:id,member_id:m,place:i+1})));
 if(error){notice='تعذّر السحب: '+error.message;return render()}
 const now=Date.now();
 await sb.from('events').update({ended_at:new Date(now).toISOString(),registration_closes_at:new Date(Math.min(now,+new Date(e.registration_closes_at))).toISOString()}).eq('id',id);
 await sb.rpc('add_points',{ids:pool,pts:5});await sb.rpc('add_points',{ids:ids.slice(0,1),pts:50});if(ids.length>1)await sb.rpc('add_points',{ids:ids.slice(1),pts:25});log('سحب فائزين: '+e.title,id);
 const {data:ms}=await sb.from('members').select('discord_id,username').in('discord_id',ids);
 await load();tab='winners';render();
 const nm=ids.map(i=>ms?.find(m=>m.discord_id===i)?.username||'عضو');
 const o=document.createElement('div');o.id='reveal';o.onclick=()=>o.remove();
 o.innerHTML=`<h2>🏆 الفائزون</h2><div class="small" style="color:var(--m)">${esc(e.title)}</div>`+nm.map((x,i)=>`<div class="n" style="animation-delay:${.8+i*.7}s">${i+1}. ${esc(x)}</div>`).join('')+'<small>اضغط للإغلاق</small>';
 document.body.appendChild(o)}

init();
</script>
</body>
</html>
