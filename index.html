<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فعاليات Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#14131a;--s:#1d1c27;--s2:#272634;--t:#ece9f5;--m:#9a97ad;--a:#8f7cff;--g:#e8c468;--r:#ff7a7a;--ok:#5fd18f}
:root[data-theme="light"]{--bg:#f4f3f8;--s:#fff;--s2:#e9e7f2;--t:#1c1b26;--m:#5f5c73;--a:#5b45e0;--g:#a87a00;--r:#c62f2f;--ok:#1d8a52}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;line-height:1.6;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
.wrap{max-width:640px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:22px;margin:0}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--a);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
button.ghost{background:var(--s2);color:var(--t)}
button.danger{background:var(--r);color:#fff}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--a);outline-offset:2px}
nav{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto}
nav button{background:var(--s);color:var(--m);white-space:nowrap}
nav button.on{background:var(--a);color:#fff}
.card{background:var(--s);border-radius:14px;padding:16px;margin-bottom:12px}
.card h3{margin:0 0 4px;font-size:18px}
.muted{color:var(--m);font-size:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px}
.count{font-weight:700;font-variant-numeric:tabular-nums;color:var(--g)}
.closed{color:var(--r)}
.place{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--s2)}
.place b{color:var(--g);min-width:28px}
.place img{width:32px;height:32px;border-radius:50%}
input,textarea{width:100%;background:var(--s2);border:1px solid transparent;border-radius:10px;padding:10px;margin:4px 0 10px}
label{font-size:14px;color:var(--m)}
.login{text-align:center;padding:60px 16px}
.login p{color:var(--m);margin:8px 0 22px}
.msg{background:var(--s2);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.user{display:flex;align-items:center;gap:8px;font-size:14px}
.user img{width:30px;height:30px;border-radius:50%}
</style>
</head>
<body>
<div class="wrap" id="app"><p class="muted">جاري التحميل…</p></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script>
/* ===== الإعدادات: الصق المفتاح العام (sb_publishable_...) هون ===== */
const SUPABASE_URL = "https://sswepnelpxzwffofbrst.supabase.co";
const SUPABASE_KEY = "sb_publishable_5i_i1TtcucbEwn0RX_uDEg_i8UHRfHv";
const GUILD_ID = "1564502050614804571";
/* ================================================================ */
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById('app');
let me = null, isAdmin = false, tab = 'events', events = [], myRegs = new Set(), notice = '';

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt = d => new Date(d).toLocaleString('ar', {dateStyle:'medium', timeStyle:'short'});

async function login(){
  await sb.auth.signInWithOAuth({provider:'discord', options:{scopes:'identify guilds.members.read', redirectTo: location.origin + location.pathname}});
}
async function logout(){ await sb.auth.signOut(); location.reload(); }

async function init(){
  const {data:{session}} = await sb.auth.getSession();
  if(!session) return renderLogin();
  const u = session.user, meta = u.user_metadata || {};
  const id = meta.provider_id;
  let joined = null;
  if(session.provider_token){
    try{
      const r = await fetch(`https://discord.com/api/v10/users/@me/guilds/${GUILD_ID}/member`, {headers:{Authorization:'Bearer '+session.provider_token}});
      if(!r.ok){ await sb.auth.signOut(); return renderLogin('لازم تكون عضو بالسيرفر عشان تدخل الموقع.'); }
      joined = (await r.json()).joined_at;
    }catch(e){ await sb.auth.signOut(); return renderLogin('تعذّر التحقق من العضوية، جرّب مرة ثانية.'); }
    await sb.from('members').upsert({discord_id:id, username:meta.full_name || meta.name || 'عضو', avatar_url:meta.avatar_url, joined_server_at:joined}, {onConflict:'discord_id', ignoreDuplicates:true});
  }
  const {data:m} = await sb.from('members').select('discord_id,username,avatar_url,is_admin').eq('discord_id', id).maybeSingle();
  if(!m){ await sb.auth.signOut(); return renderLogin('سجّل الدخول من جديد لإكمال التحقق.'); }
  me = m; isAdmin = !!m.is_admin;
  await load();
  render();
  setInterval(tick, 1000);
}

async function load(){
  const {data:ev} = await sb.from('events').select('*').eq('is_archived', false).order('starts_at');
  events = ev || [];
  const {data:rg} = await sb.from('registrations').select('event_id,status').eq('member_id', me.discord_id).neq('status','cancelled');
  myRegs = new Set((rg || []).map(r => r.event_id));
}

function renderLogin(msg){
  app.innerHTML = `<div class="login"><h1>فعاليات Nexus</h1><p>سجّل دخولك بحساب ديسكورد للتسجيل بالفعاليات. الموقع لأعضاء السيرفر فقط.</p>${msg ? `<div class="msg">${esc(msg)}</div>` : ''}<button onclick="login()">الدخول بحساب ديسكورد</button></div>`;
}

function render(){
  const tabs = [['events','الفعاليات'],['winners','الفائزون']];
  if(isAdmin) tabs.push(['admin','إدارة']);
  app.innerHTML = `
  <header><h1>فعاليات Nexus</h1>
    <div class="user">${me.avatar_url ? `<img src="${esc(me.avatar_url)}" alt="">` : ''}<span>${esc(me.username)}</span><button class="ghost" onclick="logout()">خروج</button></div></header>
  ${notice ? `<div class="msg">${esc(notice)}</div>` : ''}
  <nav>${tabs.map(([k,v]) => `<button class="${tab===k?'on':''}" onclick="go('${k}')">${v}</button>`).join('')}</nav>
  <div id="view"></div>`;
  if(tab==='events') viewEvents(); else if(tab==='winners') viewWinners(); else viewAdmin();
}
function go(t){ tab = t; notice = ''; render(); }

function left(e){
  const ms = new Date(e.registration_closes_at) - Date.now();
  if(ms <= 0) return null;
  const s = Math.floor(ms/1000), d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60), x = s%60;
  return (d ? d+' يوم ' : '') + [h,m,x].map(n => String(n).padStart(2,'0')).join(':');
}
function viewEvents(){
  const v = document.getElementById('view');
  if(!events.length){ v.innerHTML = '<div class="card muted">ما في فعاليات حالياً. ارجع قريباً.</div>'; return; }
  v.innerHTML = events.map(e => {
    const open = left(e) !== null, reg = myRegs.has(e.id);
    return `<div class="card"><h3>${esc(e.title)}</h3>
      <div class="muted">${esc(e.description || '')}</div>
      <div class="muted">موعد الفعالية: ${fmt(e.starts_at)}</div>
      <div class="row"><span data-close="${e.id}" class="count ${open?'':'closed'}">${open ? 'يقفل التسجيل بعد '+left(e) : 'التسجيل مقفل'}</span>
      ${reg ? `<button class="ghost" ${open?'':'disabled'} onclick="unreg('${e.id}')">إلغاء التسجيل</button>` : `<button ${open?'':'disabled'} onclick="reg('${e.id}')">سجّل</button>`}</div></div>`;
  }).join('');
}
function tick(){
  if(tab !== 'events') return;
  events.forEach(e => {
    const el = document.querySelector(`[data-close="${e.id}"]`); if(!el) return;
    const l = left(e);
    if(l === null && !el.classList.contains('closed')) return render();
    if(l !== null) el.textContent = 'يقفل التسجيل بعد ' + l;
  });
}
async function reg(id){
  const {error} = await sb.from('registrations').insert({event_id:id, member_id:me.discord_id});
  notice = error ? 'ما انسجّل: غالباً التسجيل انقفل أو إنك مسجّل أصلاً.' : 'تم تسجيلك بالفعالية.';
  await load(); render();
}
async function unreg(id){
  const {error} = await sb.from('registrations').delete().eq('event_id', id).eq('member_id', me.discord_id);
  notice = error ? 'تعذّر إلغاء التسجيل.' : 'تم إلغاء تسجيلك.';
  await load(); render();
}

async function viewWinners(){
  const v = document.getElementById('view');
  const {data} = await sb.from('winners').select('place, members(username,avatar_url), events(title)').order('announced_at', {ascending:false});
  if(!data || !data.length){ v.innerHTML = '<div class="card muted">لسا ما انعلن عن فائزين.</div>'; return; }
  const by = {};
  data.forEach(w => { const t = w.events?.title || 'فعالية'; (by[t] = by[t] || []).push(w); });
  v.innerHTML = Object.entries(by).map(([t, ws]) => `<div class="card"><h3>${esc(t)}</h3>` +
    ws.sort((a,b) => a.place-b.place).map(w => `<div class="place"><b>${w.place}</b>${w.members?.avatar_url ? `<img src="${esc(w.members.avatar_url)}" alt="">` : ''}<span>${esc(w.members?.username)}</span></div>`).join('') + '</div>').join('');
}

function viewAdmin(){
  const v = document.getElementById('view');
  v.innerHTML = `<div class="card"><h3>فعالية جديدة</h3>
    <label>الاسم</label><input id="a_t">
    <label>الوصف</label><textarea id="a_d" rows="2"></textarea>
    <label>موعد الفعالية</label><input id="a_s" type="datetime-local">
    <label>إغلاق التسجيل</label><input id="a_c" type="datetime-local">
    <button onclick="addEvent()">إضافة</button></div>
    <div class="card"><h3>سحب الفائزين</h3>
    ${events.map(e => `<div class="row"><span>${esc(e.title)}</span><button class="ghost" onclick="draw('${e.id}')">اسحب</button></div>`).join('') || '<span class="muted">ما في فعاليات.</span>'}</div>`;
}
async function addEvent(){
  const t = a_t.value.trim(), s = a_s.value, c = a_c.value;
  if(!t || !s || !c){ notice = 'عبّي الاسم والموعد ووقت الإغلاق.'; return render(); }
  const {error} = await sb.from('events').insert({title:t, description:a_d.value, starts_at:new Date(s).toISOString(), registration_closes_at:new Date(c).toISOString(), created_by:me.discord_id});
  notice = error ? 'تعذّرت الإضافة: ' + error.message : 'انضافت الفعالية.';
  await load(); tab = error ? 'admin' : 'events'; render();
}
async function draw(id){
  const n = parseInt(prompt('كم فائز؟', '1'), 10); if(!n) return;
  const {data} = await sb.from('registrations').select('member_id').eq('event_id', id).eq('status','confirmed');
  if(!data || !data.length){ notice = 'ما في مسجلين.'; return render(); }
  const pool = data.map(r => r.member_id);
  for(let i = pool.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  const rows = pool.slice(0, n).map((m, i) => ({event_id:id, member_id:m, place:i+1}));
  const {error} = await sb.from('winners').insert(rows);
  notice = error ? 'تعذّر السحب: ' + error.message : 'تم السحب.';
  tab = error ? 'admin' : 'winners'; render();
}

init();
</script>
</body>
</html>
